# Projet Xcode de l'app iPhone BlockLucky, généré par XcodeGen : `cd ios && xcodegen`
name: BlockLucky
options:
  bundleIdPrefix: fr.epitech.blocklucky
  developmentLanguage: fr
  deploymentTarget:
    iOS: "17.0"
targets:
  BlockLucky:
    type: application
    platform: iOS
    sources: [BlockLucky]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.epitech.blocklucky.app
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: BlockLucky
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S57686D5DQ
